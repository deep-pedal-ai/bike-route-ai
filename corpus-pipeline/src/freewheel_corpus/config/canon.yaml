# DRAFT — every coordinate requires human verification before ingestion
#
# These ~40 marquee NYC-metro rides are a best-effort DRAFT (Phase 4 / WP4). The
# coordinates are HUMAN-ENTERED ESTIMATES from map knowledge, NOT survey-grade —
# a meaningful fraction will route to a distance OUTSIDE the ±25% gate on the
# first live run and be SKIPPED + logged (this is EXPECTED, PLAN §11). A human
# verifies each coordinate (and tunes the waypoints so ORS routes the intended
# corridor) before a re-run promotes the skipped entries.
#
# CONVENTION (Q5): coordinates here are HUMAN [lat, lon] — latitude FIRST. Code
# swaps to [lon, lat] in exactly one place (p4.latlon_to_lonlat) with a metro-
# bounds guard. This is the OPPOSITE order from config/metro_boundary.geojson
# (RFC 7946 [lon, lat]). Do not transpose.
#
# Each entry:
#   slug:        stable id (source_id = "{slug}:{variant_name}")
#   name:        human label
#   start:       [lat, lon] start point
#   waypoints:   [[lat, lon], ...] intermediate points shaping the route
#   expected_km: the routed distance we EXPECT (for out_and_back this is the FULL
#                round-trip distance — the ±25% gate compares against it)
#   out_and_back: true → a return leg back to the start is appended (Q6b; the
#                flag is persisted into routes.tags)
#   variants:    length/direction variants, each with its own name + expected_km
#                (and optionally overriding waypoints / out_and_back)


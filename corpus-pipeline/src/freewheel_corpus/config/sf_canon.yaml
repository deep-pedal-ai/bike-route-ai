# DRAFT — every coordinate requires human verification before ingestion
#
# These 58 marquee San Francisco / Bay Area rides are a best-effort DRAFT (Phase 4
# / WP4), mirroring config/canon.yaml (NY) and config/seattle_canon.yaml. The
# coordinates are HUMAN-ENTERED ESTIMATES from map knowledge, NOT survey-grade —
# a meaningful fraction will route to a distance OUTSIDE the ±25% gate on the
# first live run and be SKIPPED + logged (this is EXPECTED, plan §8/§11). A human
# verifies each coordinate (and tunes the waypoints so ORS routes the intended
# corridor) before a re-run promotes the skipped entries.
#
# CONVENTION (Q5): coordinates here are HUMAN [lat, lon] — latitude FIRST. Code
# swaps to [lon, lat] in exactly one place (p4.latlon_to_lonlat) with a region-
# bounds guard (SF box: lat 36.9-38.2, lon -123.0..-121.5). This is the OPPOSITE
# order from config/sf_boundary.geojson (RFC 7946 [lon, lat]). Do not transpose.
#
# Entries 1-50: infrastructure-scored marquee rides.
# Entries 51-58: road climbs (tagged road_climb: true).
#
# Each entry mirrors canon.yaml's schema:
#   slug / name / start [lat, lon] / waypoints [[lat, lon], ...] /
#   expected_km (FULL round-trip distance for out_and_back) / out_and_back /
#   variants (each its own name + expected_km, optionally overriding waypoints).


# DRAFT — every coordinate requires human verification before ingestion
#
# These marquee Seattle / Puget Sound rides are a best-effort DRAFT (Phase 4 /
# WP4), mirroring config/canon.yaml (NY). The coordinates are HUMAN-ENTERED
# ESTIMATES from map knowledge, NOT survey-grade — a meaningful fraction will
# route to a distance OUTSIDE the ±25% gate on the first live run and be SKIPPED
# + logged (this is EXPECTED, plan §8/§11). A human verifies each coordinate (and
# tunes the waypoints so ORS routes the intended corridor) before a re-run
# promotes the skipped entries.
#
# CONVENTION (Q5): coordinates here are HUMAN [lat, lon] — latitude FIRST. Code
# swaps to [lon, lat] in exactly one place (p4.latlon_to_lonlat) with a region-
# bounds guard (Seattle box: lat 47.0-48.0, lon -122.6..-121.8). This is the
# OPPOSITE order from config/seattle_boundary.geojson (RFC 7946 [lon, lat]).
# Do not transpose.
#
# Each entry mirrors canon.yaml's schema:
#   slug / name / start [lat, lon] / waypoints [[lat, lon], ...] /
#   expected_km (FULL round-trip distance for out_and_back) / out_and_back /
#   variants (each its own name + expected_km, optionally overriding waypoints).

rides:
  - slug: burke-gilman-trail
    name: Burke-Gilman Trail
    start: [47.6700, -122.3030]      # U-District / Gas Works area
    waypoints:
      - [47.6890, -122.2750]         # Lake Washington / Matthews Beach
      - [47.7330, -122.2880]         # Lake Forest Park (NE end)
    expected_km: 28.0
    out_and_back: true
    variants:
      - { name: up-and-back, expected_km: 28.0 }
      - { name: gasworks-to-matthews, expected_km: 14.0, waypoints: [[47.6890, -122.2750]] }

